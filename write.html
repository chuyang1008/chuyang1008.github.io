<div class="page-header">
  <h1>写作指南</h1>
  <p class="subtitle">在本地或 GitHub 中完成写作，再由站点自动发布。</p>

<section class="card">
  <h2 class="card-title">安全发布文章</h2>
  <ol class="guide-list">
    <li>在 <code>_posts</code> 目录新建 <code>YYYY-MM-DD-文章标题.md</code> 文件。</li>
    <li>填写标题、摘要、分类与标签等 Front Matter。</li>
    <li>在本地运行 <code>bundle exec jekyll serve</code> 预览。</li>
    <li>确认后提交并推送到 <code>main</code>，GitHub Pages 会自动部署。</li>
  </ol>
  <p class="form-hint">这套流程不需要把访问令牌交给网页或任何访客。也可以直接在 GitHub 网页中编辑 Markdown 文件。</p>
</section>
